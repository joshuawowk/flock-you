[platformio]
src_dir = .
; Isolate this project's PlatformIO packages/platforms from other projects.
; The combined-unit Bruce host uses the pioarduino "espressif32" platform fork,
; which installs under the same name as this project's official espressif32
; platform and would otherwise clobber it in the shared ~/.platformio. A
; project-local core dir keeps the two toolchains from colliding.
core_dir = .pio-core

[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; ------------------------------------------------------------------
; Headless WiFi co-processor for the combined Flock-You unit.
; Generic ESP32-S3 N16R8 (16MB flash / 8MB OPI PSRAM). No display, no
; buzzer: continuous promiscuous IE-fingerprint sniffing only. Streams
; detection/status/gps JSON to the Bruce T-Display-S3 host over a UART
; link (LINK_TX_PIN -> host RX, LINK_RX_PIN <- host TX) AND over USB CDC
; in parallel, so a PC can still run the Flask dashboard on the same feed.
;
; Link/GPS pins are overridable here to match your wiring. To add an
; on-board GPS puck, uncomment the USE_COPROC_GPS group below.
; ------------------------------------------------------------------
[env:coproc_s3_n16r8]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DBOARD_COPROC_UART
    -DLINK_TX_PIN=2
    -DLINK_RX_PIN=42
    -DUSE_COPROC_GPS
    -DGPS_RX_PIN=44
    -DGPS_BAUD=9600

build_src_filter = +<main.cpp>

board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
